<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Moldura da janela do app web -->
  <rect x="30" y="40" width="140" height="120" rx="10" ry="10" />

  <!-- Barra superior da janela -->
  <line x1="30" y1="70" x2="170" y2="70" />

  <!-- Três círculos da barra superior (estilo botões de controle) -->
  <circle cx="45" cy="55" r="5" fill="black"/>
  <circle cx="65" cy="55" r="5" fill="black"/>
  <circle cx="85" cy="55" r="5" fill="black"/>
</svg>
